# Site configuration for https://snowflake-labs.github.io/pg_lake/
#
# GitHub Pages builds this directory with its default Jekyll pipeline, and
# remote_theme pulls in Just the Docs. See docs/README.md for how to preview
# the site locally.

title: pg_lake
description: Postgres for Iceberg and data lakes
url: https://snowflake-labs.github.io
baseurl: /pg_lake
lang: en-US

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-relative-links

color_scheme: pglake

# docs/README.md is the index for browsing on GitHub; index.md is the site
# home page.
exclude:
  - README.md

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
enable_copy_code_button: true

aux_links:
  GitHub: https://github.com/Snowflake-Labs/pg_lake
aux_links_new_tab: false

nav_external_links:
  - title: Docker setup
    url: https://github.com/Snowflake-Labs/pg_lake/blob/main/docker/README.md
  - title: Map type (pg_map)
    url: https://github.com/Snowflake-Labs/pg_lake/blob/main/pg_map/README.md

back_to_top: true
back_to_top_text: Back to top

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/Snowflake-Labs/pg_lake
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
